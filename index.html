<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Keyboard Tester is a website where you can test your PC Keyboard">
    <link rel="stylesheet" href="style.css">
    <title>Keyboard Tester</title>
</head>
<body>
    <div class="floating-settings">
        <label for="markForever">Mark forever:</label>
        <input type="checkbox" id="markForever">
    </div>

    <main>
        <div class="keyboard-grid" id="keyboard">
            <div class="keycap Escape" id="esc">ESC</div>
            <div class="keycap F1">F1</div>
            <div class="keycap F2">F2</div>
            <div class="keycap F3">F3</div>
            <div class="keycap F4">F4</div>
            <div class="keycap F5">F5</div>
            <div class="keycap F6">F6</div>
            <div class="keycap F7" id="f7">F7</div>
            <div class="keycap F8" id="f8">F8</div>
            <div class="keycap F9" id="f9">F9</div>
            <div class="keycap F10" id="f10">F10</div>
            <div class="keycap F11" id="f11">F11</div>
            <div class="keycap F12" id="f12">F12</div>
            <div class="keycap">print</div>
            <div class="keycap Delete">DEL</div>
            <div class="keycap">Light</div>

            <div class="keycap Backquote">~</div>
            <div class="keycap Digit1">1</div>
            <div class="keycap Digit2">2</div>
            <div class="keycap Digit3">3</div>
            <div class="keycap Digit4">4</div>
            <div class="keycap Digit5">5</div>
            <div class="keycap Digit6">6</div>
            <div class="keycap Digit7">7</div>
            <div class="keycap Digit8">8</div>
            <div class="keycap Digit9">9</div>
            <div class="keycap Digit0">0</div>
            <div class="keycap Minus">-</div>
            <div class="keycap Equal">=</div>
            <div class="keycap Backspace" id="backspace">Backspace</div>
            <div class="keycap PageUp" id="">pgup</div>

            <div class="keycap Tab" id="tab">tab</div>
            <div class="keycap KeyQ">q</div>
            <div class="keycap KeyW">w</div>
            <div class="keycap KeyE">e</div>
            <div class="keycap KeyR">r</div>
            <div class="keycap KeyT">t</div>
            <div class="keycap KeyY">y</div>
            <div class="keycap KeyU">u</div>
            <div class="keycap KeyI">i</div>
            <div class="keycap KeyO">o</div>
            <div class="keycap KeyP">p</div>
            <div class="keycap BracketLeft">[</div>
            <div class="keycap BracketRight">]</div>
            <div class="keycap Enter" id="enter">Enter</div>
            <div class="keycap PageDown">pgdn</div>

            <div class="keycap CapsLock" id="caps">caps</div>
            <div class="keycap KeyA">a</div>
            <div class="keycap KeyS">s</div>
            <div class="keycap KeyD">d</div>
            <div class="keycap KeyF">f</div>
            <div class="keycap KeyG">g</div>
            <div class="keycap KeyH">h</div>
            <div class="keycap KeyJ">j</div>
            <div class="keycap KeyK">k</div>
            <div class="keycap KeyL">l</div>
            <div class="keycap Semicolon">;</div>
            <div class="keycap Quote">'</div>
            <div class="keycap Backslash">\</div>
            <div class="keycap Enter" id="enter">Enter</div>
            <div class="keycap Home">home</div>

            <div class="keycap ShiftLeft">shift</div>
            <div class="keycap IntlBackslash">\</div>
            <div class="keycap KeyZ">z</div>
            <div class="keycap KeyX">x</div>
            <div class="keycap KeyC">c</div>
            <div class="keycap KeyV">v</div>
            <div class="keycap KeyB">b</div>
            <div class="keycap KeyN">n</div>
            <div class="keycap KeyM">m</div>
            <div class="keycap Comma">,</div>
            <div class="keycap Period">.</div>
            <div class="keycap Slash">/</div>
            <div class="keycap ShiftRight" id="shift2">shift</div>
            <div class="keycap ArrowUp">^</div>
            <div class="keycap End">end</div>

            <div class="keycap ControlLeft">control</div>
            <div class="keycap MetaLeft">Win</div>
            <div class="keycap AltLeft">alt</div>
            <div class="keycap Space" id="space">spacebar</div>
            <div class="keycap AltRight">alt gr</div>
            <div class="keycap">fn</div>
            <div class="keycap ControlRight">control</div>
            <div class="keycap ArrowLeft"><</div>
            <div class="keycap ArrowDown">↓</div>
            <div class="keycap ArrowRight">></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
